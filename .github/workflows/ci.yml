# 린트 · 테스트. main push 와 PR 에서 돈다
#   test: extras 전부 설치. 토크나이저 계약 테스트는 CI 환경변수가 있으면 skip 하지 않고 실패한다
#   base: extras 없이 설치해 base import 가 extras 를 올리지 않는지만 본다
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install
        run: uv sync --locked --all-extras
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Pytest
        run: uv run pytest

  base:
    name: base (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install
        run: uv sync --locked
      - name: Base import
        run: uv run pytest tests/test_import_base.py
