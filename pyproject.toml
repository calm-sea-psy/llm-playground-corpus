[project]
name = "playground-corpus"
version = "0.0.0"
description = "코퍼스 타입 · 청킹 · 임베딩 — llm-playground 공통 모듈"
readme = "README.md"
authors = [
    { name = "yunpilsoo", email = "305675348+calm-sea-psy@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "tokenizers>=0.22",
]

[project.optional-dependencies]
parquet = ["pyarrow>=26.0.0"]
local = [
    "torch>=2.11.0",
    "sentence-transformers>=5.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
# bench/ 전용. 기본 설치 · 테스트에는 들어가지 않는다: uv run --group bench --extra parquet --extra local ...
bench = [
    "playground-evalkit",
]

# 이 레포에서 개발할 때만 쓰는 설정. 설치하는 쪽에는 영향이 없다
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
# 첫 태그 전 — llm-playground-llm 을 같은 부모 폴더에 나란히 clone
playground-evalkit = { path = "../llm-playground-llm/packages/evalkit", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
